services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - /bin/sh
      - -c
      - >-
        IMPORT=""; if [ -f /data/firestore/firestore_export.overall_export_metadata ]; then IMPORT="--import-data=/data/firestore"; fi;
        exec gcloud emulators firestore start --project=party-quiz-local --host-port=0.0.0.0:8080 --quiet $$IMPORT --export-on-exit=/data/firestore
    ports:
      - "8081:8080"
    volumes:
      - firestore-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8080), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  storage:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -external-url http://localhost:4443 -backend filesystem -filesystem-root /data
    ports:
      - "4443:4443"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: http://localhost:3000
      PORT: 8000
      FIRESTORE_ENABLED: ${FIRESTORE_ENABLED:-true}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-party-quiz-local}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-firestore:8080}
      AVATAR_STORAGE_ENABLED: ${AVATAR_STORAGE_ENABLED:-true}
      AVATAR_BUCKET: ${AVATAR_BUCKET:-majority-main}
      AVATAR_OBJECT_PREFIX: ${AVATAR_OBJECT_PREFIX:-user-thumbnail}
      AVATAR_STYLE_VERSION: ${AVATAR_STYLE_VERSION:-party-token-v1}
      STORAGE_EMULATOR_HOST: ${STORAGE_EMULATOR_HOST:-http://storage:4443}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      firestore:
        condition: service_healthy
      storage:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
        NEXT_PUBLIC_AVATAR_STYLE_VERSION: ${AVATAR_STYLE_VERSION:-party-token-v1}
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  firestore-data:
  storage-data:
