substitutions:
  _IMAGE: ""
  _API_URL: ""
  _WS_URL: ""
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_WS_URL=${_WS_URL}
      - .
images:
  - ${_IMAGE}
